<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset Password - BAC SAFE</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <nav role="navigation" aria-label="Primary Navigation">
    <a href="index.html" aria-label="BAC SAFE Home" class="logo">BAC SAFE</a>
    <ul>
      <li><a href="register.html">Register</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>
</header>

<main class="container" aria-label="Reset Password Form">
  <section class="card" tabindex="0">
    <h1>Reset Password</h1>
    <p>This is a placeholder for a secure token-based password reset flow.</p>
    <p>Password must be at least 8 characters, contain uppercase and lowercase letters, and include at least one number.</p>
    <form id="reset-password-form" novalidate>
      <fieldset>
        <label for="new-password">New Password <span aria-hidden="true">*</span></label>
        <input type="password" id="new-password" name="newPassword" required aria-describedby="password-rules-reset" />
      </fieldset>
      <fieldset>
        <label for="confirm-new-password">Confirm New Password <span aria-hidden="true">*</span></label>
        <input type="password" id="confirm-new-password" name="confirmNewPassword" required />
      </fieldset>
      <input type="submit" value="Reset Password" aria-label="Reset password" />
      <div id="reset-error" class="error-message" aria-live="polite" style="margin-top:0.5rem;"></div>
      <div id="reset-success" class="success-message" aria-live="polite" style="margin-top:0.5rem;"></div>
    </form>
  </section>
</main>

<footer>
  <p>&copy; 2026 Botswana Accountancy College - BAC SAFE Prototype</p>
</footer>

<script src="assets/js/main.js" defer></script>
</body>
</html>
