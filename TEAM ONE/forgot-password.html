<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forgot Password - BAC SAFE</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <nav role="navigation" aria-label="Primary Navigation">
    <a href="index.html" aria-label="BAC SAFE Home" class="logo">BAC SAFE</a>
    <ul>
      <li><a href="register.html">Register</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>
</header>

<main class="container" aria-label="Password Recovery Form">
  <section class="card" tabindex="0">
    <h1>Forgot Password</h1>
    <form id="forgot-password-form" novalidate>
      <fieldset>
        <label for="email-reset">Registered College Email <span aria-hidden="true">*</span></label>
        <input type="email" id="email-reset" name="email" required autocomplete="email" placeholder="you@bac.ac.bw" />
        <div id="error-email-reset" class="error-message" aria-live="polite"></div>
      </fieldset>
      <input type="submit" value="Request Password Reset" aria-label="Request password reset" />
    </form>

    <div id="reset-status" role="alert" aria-live="polite" style="margin-top:1rem;"></div>
  </section>
</main>

<footer>
  <p>&copy; 2026 Botswana Accountancy College - BAC SAFE Prototype</p>
</footer>

<script src="assets/js/main.js" defer></script>
</body>
</html>
